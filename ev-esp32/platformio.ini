; PlatformIO project: EV Controller Interface, ESP32 port of firmware.cpp
;
; In VS Code / Cursor (PlatformIO or pioarduino extension): in the status bar at the
; bottom of the window, the tick = Build, the arrow = Upload, the plug = Serial Monitor.
; From a terminal in this folder:
;   pio run                 build
;   pio run -t upload       build and flash the board
;   pio device monitor      watch the serial output (Ctrl+C to quit)

[env:esp32]
; pioarduino platform 55.03.312 = Arduino-ESP32 core 3.3.12 (the version this code
; was checked against). The first build downloads the toolchain and framework
; (a few GB, once).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev                           ; generic ESP32 board, works for the WROVER-E DevKitC-VE
framework = arduino                        ; Arduino functions, same style as Energia
monitor_speed = 9600                       ; must match Serial.begin(9600) in src/main.cpp
monitor_filters = esp32_exception_decoder  ; turns crash addresses into readable function names
