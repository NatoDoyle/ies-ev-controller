; ---------------------------------------------------------------------------
; PlatformIO project file - EV Controller Interface (ESP32-WROVER-E port)
;
;   pio run                    -> build the ESP32 firmware
;   pio run -t upload          -> build and flash the DevKit
;   pio device monitor         -> watch the $EV transmit array at 115200 baud
;   pio test -e native         -> run the unit tests for lib/ev_logic on the PC
; ---------------------------------------------------------------------------

[platformio]
default_envs = esp32                         ; "pio run" builds the ESP32 target only

[env:esp32]
; pioarduino platform 55.03.312 = arduino-esp32 core 3.3.12
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev                             ; generic ESP32 board def works for the DevKitC-VE (WROVER-E)
framework = arduino                          ; Arduino API, same style as Energia on the MSP430
monitor_speed = 115200                       ; must match SERIAL_BAUD in include/config.h
monitor_filters = esp32_exception_decoder    ; decodes crash backtraces in the monitor
board_build.embed_txtfiles = web/index.html  ; web dashboard is compiled into the firmware
lib_deps =
    ESP32Async/AsyncTCP@^3.5.0
    ESP32Async/ESPAsyncWebServer@^3.12.1
test_ignore = *                              ; unit tests only run in the native env

[env:native]
platform = native                            ; builds with the PC's own compiler
test_framework = unity                       ; Unity test framework
build_flags = -Wall -Wextra                  ; turn on compiler warnings
